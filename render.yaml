# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render → New → Blueprint → apply render.yaml
#
# Recommended: Starter plan or higher (512MB free tier often OOMs on torch + embeddings).

services:
  - type: web
    name: rag-chatbot
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: rag-data
      mountPath: /app/data
      sizeGB: 1
